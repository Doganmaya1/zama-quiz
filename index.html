<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zama FHE Knowledge Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* --- CSS Variables for Easy Theming --- */
    :root {
      --primary-color: #FFD700; /* Zama Yellow */
      --secondary-color: #000000;
      --light-text: #FFFFFF;
      --dark-text: #1a1a1a;
      --background-color: #FFD700; /* Yellow background */
      --correct-color: #28a745;
      --incorrect-color: #dc3545;
      --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    /* --- General Body Styles --- */
    body {
      font-family: "Poppins", sans-serif;
      background-color: var(--background-color); /* Yellow background */
      color: var(--secondary-color); /* Black text */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    /* --- Main Quiz Container --- */
    .quiz-container {
      background: var(--light-text); /* White background for container */
      width: 100%;
      max-width: 700px;
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      padding: 40px;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* --- Typography --- */
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--secondary-color); /* Black */
    }
    h1 span {
      color: var(--primary-color); /* Yellow */
      text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--secondary-color); /* Black text */
    }

    /* --- Buttons --- */
    button {
      background-color: var(--secondary-color); /* Black background */
      color: var(--light-text); /* White text */
      border: none;
      padding: 15px 30px;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px 5px;
      font-weight: 600;
      transition: transform 0.2s ease, background-color 0.2s ease;
      display: inline-block;
      width: 80%;
      max-width: 400px;
      text-align: left;
    }
    button:hover:not(:disabled) {
      transform: translateY(-3px);
      background-color: #333;
    }
    button:disabled {
        cursor: not-allowed;
        opacity: 0.8;
    }
    .option-btn.correct { background-color: var(--correct-color); color: var(--light-text); }
    .option-btn.incorrect { background-color: var(--incorrect-color); color: var(--light-text); }

    /* --- Quiz Section --- */
    .question-header {
        margin-bottom: 25px;
    }
    .question-text {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 30px;
        color: var(--secondary-color); /* Black */
    }
    .progress-bar-container {
        width: 100%;
        height: 8px;
        background-color: #e0e0e0;
        border-radius: 4px;
        margin-bottom: 20px;
    }
    .progress-bar {
        height: 100%;
        width: 0%;
        background-color: var(--primary-color); /* Yellow */
        border-radius: 4px;
        transition: width 0.3s ease;
    }

    /* --- Timer --- */
    #timer-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin-bottom: 25px;
    }
    #timer-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--secondary-color); /* Black */
    }
    #timer-bar-container {
      width: 60%;
      height: 10px;
      background-color: #e0e0e0;
      border-radius: 5px;
    }
    #timer-bar {
      height: 100%;
      width: 100%;
      background-color: var(--correct-color);
      border-radius: 5px;
      transition: width 1s linear;
    }

    /* --- Sections Display Logic --- */
    #quiz, #result { display: none; }

    /* --- Result Canvas --- */
    canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-top: 20px;
      display: block;
    }

    /* --- Responsive Design --- */
    @media (max-width: 600px) {
        body { padding: 10px; }
        .quiz-container { padding: 20px; }
        h1 { font-size: 2rem; }
        .question-text { font-size: 1.2rem; }
        button { width: 100%; padding: 15px; }
        #timer-bar-container { width: 50%; }
        #timer-text { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <div id="intro">
      <h1>Zama <span>FHE</span> Quiz</h1>
      <p>
        Step into the future of privacy. Test your FHE knowledge against the clock.
        <b>10 questions, 15 seconds each.</b> Are you ready?
      </p>
      <button id="startButton">Start the Challenge</button>
    </div>

    <div id="quiz">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="question-header">
        <p>Question <span id="currentQuestion"></span> of <span id="totalQuestions"></span></p>
        <div id="timer-container">
            <div id="timer-text">Time: 15s</div>
            <div id="timer-bar-container">
                <div id="timer-bar"></div>
            </div>
        </div>
      </div>
      <p class="question-text" id="questionText"></p>
      <div id="optionsContainer"></div>
    </div>

    <div id="result">
      <h1>Quiz Complete!</h1>
      <p>Here is your final score. Share it with the world!</p>
      <canvas id="canvas"></canvas><br>
      <button onclick="shareImage()">Share on X</button>
      <button onclick="downloadImage()">Download Result</button>
    </div>
  </div>

  <script>
    const questions = [
      { q: "What does FHE stand for?", options: ["Fast Homomorphic Encryption", "Federated Homomorphic Encoding", "Fully Homomorphic Encryption", "Fault-tolerant Hash Encryption"], correct: "Fully Homomorphic Encryption" }, // Correct: C
      { q: "Which company provides the core FHE libraries for confidential smart contracts?", options: ["ZeroCorp", "Homomorphic Labs", "CryptoChain", "Zama"], correct: "Zama" }, // Correct: D
      { q: "What is the key benefit of FHE in blockchain?", options: ["Lowering gas fees", "Computing on encrypted data without decrypting it", "Achieving faster transaction finality", "Simplifying wallet integration"], correct: "Computing on encrypted data without decrypting it" }, // Correct: B
      { q: "The Zama Protocol is best described as a:", options: ["Cross-chain confidentiality layer", "New Layer-1 blockchain", "Web browser extension", "Centralized cloud service"], correct: "Cross-chain confidentiality layer" }, // Correct: A
      { q: "Which of the following is an open-source FHE library by Zama?", options: ["secret-chain", "tfhe-rs", "homomorph-py", "zchain-sdk"], correct: "tfhe-rs" }, // Correct: B
      { q: "What does 'composability' mean for smart contracts?", options: ["Contracts are automatically encrypted by default", "Contracts can be combined to build new applications", "Contracts can only be read by authorized nodes", "Contracts have fixed, predictable gas rates"], correct: "Contracts can be combined to build new applications" }, // Correct: B
      { q: "Zama's FHE is post-quantum secure. This implies:", options: ["It becomes slower after quantum advancements", "It can only run on a quantum-powered internet", "It's resistant to attacks by known quantum algorithms", "It requires a quantum computer for encryption"], correct: "It's resistant to attacks by known quantum algorithms" }, // Correct: C
      { q: "Which cryptographic technique helps decentralize the global network key in Zama?", options: ["PoW (Proof of Work)", "MPC (Multi-Party Computation)", "SSO (Single Sign-On)", "ZKP (Zero-Knowledge Proofs)"], correct: "MPC (Multi-Party Computation)" }, // Correct: B
      { q: "What is a primary use case for confidential smart contracts?", options: ["Private DeFi and confidential token transfers", "Accelerating the mining process", "Reducing overall block size on-chain", "Public mempool monitoring and analysis"], correct: "Private DeFi and confidential token transfers" }, // Correct: A
      { q: "Where can developers find Zama's open-source projects?", options: ["In a private, invitation-only repository", "Exclusively within a whitepaper PDF", "On GitHub under the zama-ai organization", "On a proprietary, closed-source app store"], correct: "On GitHub under the zama-ai organization" } // Correct: C
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    let timeLeft = 15;

    const introDiv = document.getElementById("intro");
    const quizDiv = document.getElementById("quiz");
    const resultDiv = document.getElementById("result");
    const startButton = document.getElementById("startButton");

    function startQuiz() {
      introDiv.style.display = "none";
      quizDiv.style.display = "block";
      document.getElementById("totalQuestions").textContent = questions.length;
      showQuestion();
    }

    function showQuestion() {
      if (currentQuestionIndex >= questions.length) {
        showResult();
        return;
      }
      
      resetQuestionUI();
      const q = questions[currentQuestionIndex];

      document.getElementById("currentQuestion").textContent = currentQuestionIndex + 1;
      document.getElementById("questionText").textContent = (currentQuestionIndex + 1) + ". " + q.q;
      document.getElementById("progressBar").style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;
      
      const optionsContainer = document.getElementById("optionsContainer");
      optionsContainer.innerHTML = "";
      
      const labels = ['A- ', 'B- ', 'C- ', 'D- '];
      q.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.textContent = labels[index] + option;
        btn.classList.add("option-btn");
        btn.onclick = () => selectAnswer(btn, option, q.correct);
        optionsContainer.appendChild(btn);
      });

      startTimer();
    }
    
    function resetQuestionUI() {
        clearInterval(timer);
        timeLeft = 15;
        document.getElementById("timer-text").textContent = `Time: ${timeLeft}s`;
        const timerBar = document.getElementById("timer-bar");
        timerBar.style.transition = 'none'; // reset transition for instant change
        timerBar.style.width = '100%';
        void timerBar.offsetWidth; 
        timerBar.style.transition = 'width 1s linear';
    }

    function startTimer() {
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById("timer-text").textContent = `Time: ${timeLeft}s`;
        document.getElementById("timer-bar").style.width = `${(timeLeft / 15) * 100}%`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          document.querySelectorAll('.option-btn').forEach(btn => {
              btn.disabled = true;
              const optionText = btn.textContent.slice(3); // Remove A- etc.
              if(optionText === questions[currentQuestionIndex].correct) {
                  btn.classList.add('correct');
              }
          });
          setTimeout(nextQuestion, 1500);
        }
      }, 1000);
    }

    function selectAnswer(button, selected, correct) {
      clearInterval(timer);
      document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

      if (selected === correct) {
        score++;
        button.classList.add("correct");
      } else {
        button.classList.add("incorrect");
        document.querySelectorAll('.option-btn').forEach(btn => {
          const optionText = btn.textContent.slice(3); // Remove A- etc.
          if (optionText === correct) {
            btn.classList.add("correct");
          }
        });
      }
      setTimeout(nextQuestion, 1500);
    }

    function nextQuestion() {
      currentQuestionIndex++;
      showQuestion();
    }

    function showResult() {
      quizDiv.style.display = "none";
      resultDiv.style.display = "block";
      drawResultCanvas();
      new ResizeObserver(drawResultCanvas).observe(document.getElementById('canvas'));
    }
    
    function drawResultCanvas() {
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();

        canvas.width = rect.width * dpr;
        canvas.height = (rect.width * 0.5) * dpr;
        ctx.scale(dpr, dpr);
        
        const cssWidth = rect.width;
        const cssHeight = rect.width * 0.5;

        const img = new Image();
        img.src = "zama-image.jpg"; // Keep as is, fallback handles missing image
        img.onload = () => {
            ctx.drawImage(img, 0, 0, cssWidth, cssHeight);
            drawText();
        };
        img.onerror = () => {
            ctx.fillStyle = "#FFD700"; // Yellow fallback
            ctx.fillRect(0, 0, cssWidth, cssHeight);
            drawText();
        };

        function drawText() {
            const percentage = Math.round((score / questions.length) * 100);
            const primaryText = `${percentage}%`;
            const secondaryText = `Quiz Result`; // Short English text as requested, above the %

            ctx.fillStyle = "white"; // White text for visibility
            ctx.textAlign = "left"; // Align left for top-left placement
            ctx.textBaseline = "top"; // Align top
            ctx.strokeStyle = "black"; // Black stroke for outline
            ctx.lineWidth = cssWidth / 100;

            // Mobil için yazı boyutunu küçült (eğer ekran genişliği < 600px ise %30 küçült)
            let secondaryFontSize = cssWidth / 30;
            let primaryFontSize = cssWidth / 8;
            let spacing = 15; // Ekstra boşluk

            if (window.innerWidth < 600) {
                primaryFontSize *= 0.7; // %30 küçült
                secondaryFontSize *= 0.8; // İkincil yazıyı da biraz küçült, opsiyonel
                spacing = 10; // Mobil için boşluğu azalt, ama üst üste binmeyi önle
            }

            // Draw secondary (small) text first, above the primary
            ctx.font = `600 ${secondaryFontSize}px Poppins`;
            ctx.strokeText(secondaryText, 20, 20);
            ctx.fillText(secondaryText, 20, 20);

            // Draw primary below it
            ctx.font = `bold ${primaryFontSize}px Poppins`;
            ctx.strokeText(primaryText, 20, 20 + secondaryFontSize + spacing); // Pozisyonu dinamik yap
            ctx.fillText(primaryText, 20, 20 + secondaryFontSize + spacing);
        }
    }

    function shareImage() {
      const canvas = document.getElementById("canvas");
      const percentage = Math.round((score / questions.length) * 100);
      const shareText = `I scored ${percentage}% on the Zama FHE Quiz! Think you can do better? #Zama #FHE #Cryptography`;

      canvas.toBlob(blob => {
        const file = new File([blob], "zama-quiz-result.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({
            title: "Zama Quiz Result",
            text: shareText,
            files: [file]
          }).catch(err => console.error("Share failed", err));
        } else {
          alert("Direct sharing isn't supported by your browser. The result image will be downloaded instead.");
          downloadImage();
        }
      }, "image/png");
    }

    function downloadImage() {
      const canvas = document.getElementById("canvas");
      const link = document.createElement("a");
      link.download = "zama-quiz-result.png";
      link.href = canvas.toDataURL();
      link.click();
    }

    startButton.addEventListener('click', startQuiz);
  </script>
</body>
</html>
