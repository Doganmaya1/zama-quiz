<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zama Quiz — 10 Questions</title>
  <style>
    body {
      font-family: "Arial", sans-serif;
      background-color: #FFD700; /* Zama yellow */
      color: #000;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      color: #000;
      margin-top: 30px;
      font-weight: 800;
    }
    #quiz, #result {
      display: none;
      margin-top: 40px;
    }
    .question {
      display: none;
      font-size: 20px;
      margin: 20px;
      font-weight: bold;
    }
    button {
      background-color: #000;
      color: #fff;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
      font-weight: bold;
    }
    button:hover {
      background-color: #222;
    }
    #timer {
      font-size: 22px;
      color: #fff;
      background: #000;
      display: inline-block;
      padding: 8px 18px;
      border-radius: 20px;
      margin-bottom: 15px;
    }
    /* canvas responsive: CSS controls displayed size; JS sets internal pixel size */
    canvas {
      width: 90%;
      max-width: 800px;
      height: auto;
      border-radius: 12px;
      margin-top: 20px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    #scoreBox {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: #000;
      color: #fff;
      padding: 15px 25px;
      border-radius: 12px;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }
    /* ensure result container is a positioning context for scoreBox */
    #result { position: relative; }
  </style>
</head>
<body>
  <h1>Zama Quiz — 10 Questions</h1>

  <div id="intro">
    <p style="font-size: 16px; font-weight: bold;">
      You can start the quiz by clicking below. You have <b>15 seconds</b> for each question — no going back!
    </p>
    <button onclick="startQuiz()">Start Quiz</button>
  </div>

  <div id="quiz"></div>

  <div id="result">
    <div id="scoreBox">
      <div>Quiz Score</div>
      <div id="score" style="font-size: 36px; font-weight: 900;"></div>
    </div>
    <canvas id="canvas"></canvas><br>
    <button onclick="shareImage()">Share on X</button>
    <button onclick="downloadImage()">Download Result</button>
  </div>

  <script>
    const questions = [
      { q: "1. What does FHE stand for?",
        options: ["Fully Homomorphic Encryption","Fast Homomorphic Encryption","Federated Homomorphic Encoding","Fault-tolerant Hash Encryption"],
        correct: "Fully Homomorphic Encryption" },
      { q: "2. Which company/project provides the protocol you studied here?",
        options: ["Zama","ZeroCorp","CryptoChain","Homomorphic Labs"],
        correct: "Zama" },
      { q: "3. What is the main advantage of FHE for blockchain apps?",
        options: ["End-to-end encrypted computation on encrypted data","Lower gas fees","Faster transaction finality","Easier wallet integration"],
        correct: "End-to-end encrypted computation on encrypted data" },
      { q: "4. The Zama Protocol is mainly described as:",
        options: ["A cross-chain confidentiality layer","A new L1 blockchain","A centralized cloud service","A browser extension"],
        correct: "A cross-chain confidentiality layer" },
      { q: "5. Which of the following is an open-source Zama project?",
        options: ["tfhe-rs","homomorph-py","secret-chain","zchain-sdk"],
        correct: "tfhe-rs" },
      { q: "6. What does composability mean in the context of smart contracts?",
        options: ["Contracts can be combined to build new apps","Contracts can only be read by nodes","Contracts are automatically encrypted","Contracts have fixed gas rates"],
        correct: "Contracts can be combined to build new apps" },
      { q: "7. Zama’s FHE approach claims to be post-quantum. This means:",
        options: ["No known quantum algorithm currently breaks it","It uses quantum computers to encrypt data","It is slower after quantum improvements","It requires a quantum internet"],
        correct: "No known quantum algorithm currently breaks it" },
      { q: "8. Which component helps decentralize the global network key in Zama?",
        options: ["MPC (Multi-Party Computation)","HPU","Relayer","Browser wallet"],
        correct: "MPC (Multi-Party Computation)" },
      { q: "9. What is a primary use case for confidential smart contracts?",
        options: ["Confidential payments and tokenization","Public mempool monitoring","Reducing block size","Faster mining"],
        correct: "Confidential payments and tokenization" },
      { q: "10. Where can developers find Zama’s source code?",
        options: ["On GitHub (zama-ai)","On a private repo only","On a whitepaper PDF only","On a closed app store"],
        correct: "On GitHub (zama-ai)" }
    ];

    let current = 0;
    let score = 0;
    let timer;
    let timeLeft = 15;

    function startQuiz() {
      document.getElementById("intro").style.display = "none";
      document.getElementById("quiz").style.display = "block";
      showQuestion();
    }

    function showQuestion() {
      const quizDiv = document.getElementById("quiz");
      quizDiv.innerHTML = "";

      if (current < questions.length) {
        const q = questions[current];
        const qDiv = document.createElement("div");
        qDiv.classList.add("question");

        const timerDiv = document.createElement("div");
        timerDiv.id = "timer";
        timerDiv.textContent = `Time left: ${timeLeft}s`;
        qDiv.appendChild(timerDiv);

        const qText = document.createElement("p");
        qText.textContent = q.q;
        qDiv.appendChild(qText);

        q.options.forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.textContent = `${String.fromCharCode(65 + i)} - ${opt}`;
          btn.onclick = () => answer(opt);
          qDiv.appendChild(btn);
          const br = document.createElement("br");
          qDiv.appendChild(br);
        });

        quizDiv.appendChild(qDiv);
        qDiv.style.display = "block";
        startTimer();
      } else {
        showResult();
      }
    }

    function startTimer() {
      timeLeft = 15;
      document.getElementById("timer").textContent = `Time left: ${timeLeft}s`;
      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").textContent = `Time left: ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          nextQuestion();
        }
      }, 1000);
    }

    function answer(selected) {
      clearInterval(timer);
      if (selected === questions[current].correct) score++;
      nextQuestion();
    }

    function nextQuestion() {
      current++;
      showQuestion();
    }

    // --- Canvas scaling helper: ensure canvas internal pixel size matches display size (handles DPR) ---
    function resizeCanvasToDisplaySize(canvas) {
      const dpr = window.devicePixelRatio || 1;
      // compute the CSS size in pixels
      const rect = canvas.getBoundingClientRect();
      const displayWidth  = Math.round(rect.width);
      const displayHeight = Math.round(rect.height || (rect.width * 0.75)); // fallback aspect
      // set internal size multiplied by DPR for sharpness
      const needResize = canvas.width !== Math.round(displayWidth * dpr) || canvas.height !== Math.round(displayHeight * dpr);
      if (needResize) {
        canvas.width  = Math.round(displayWidth * dpr);
        canvas.height = Math.round(displayHeight * dpr);
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // scale drawing operations
      }
      return needResize;
    }

    function showResult() {
      document.getElementById("quiz").style.display = "none";
      document.getElementById("result").style.display = "block";
      const percentage = Math.round((score / questions.length) * 100);
      document.getElementById("score").innerText = `${percentage}%`;

      const canvas = document.getElementById("canvas");

      // Ensure the canvas has a sensible CSS display size if not set
      if (!canvas.style.width || !canvas.style.height) {
        // set a default CSS width so getBoundingClientRect works consistently
        canvas.style.width = '90%';
        canvas.style.maxWidth = '800px';
        canvas.style.height = 'auto';
      }

      // Resize canvas internal pixels to match displayed size (and DPR)
      resizeCanvasToDisplaySize(canvas);

      const ctx = canvas.getContext("2d");

      // Now draw background image or fallback, using canvas internal size scaled via setTransform
      const img = new Image();
      img.src = "zama-image.jpg";
      img.onload = function () {
        // draw image to fill the CSS area: compute destination size in CSS pixels
        const rect = canvas.getBoundingClientRect();
        const cssW = rect.width;
        const cssH = rect.height || (cssW * (canvas.height / canvas.width)); // fallback
        // Because we scaled context with DPR, draw using CSS pixels
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, cssW, cssH);
        // draw percentage text on top (CSS pixel coordinates)
        ctx.font = "bold 60px Arial";
        ctx.fillStyle = "black";
        ctx.fillText(`${percentage}%`, 40, 100);
      };
      img.onerror = function () {
        // fallback: fill with yellow
        const rect = canvas.getBoundingClientRect();
        const cssW = rect.width;
        const cssH = rect.height || (cssW * (canvas.height / canvas.width));
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#FFD700";
        ctx.fillRect(0, 0, cssW, cssH);
        ctx.font = "bold 60px Arial";
        ctx.fillStyle = "black";
        ctx.fillText(`${percentage}%`, 40, 100);
      };
    }

    // Re-scale canvas if viewport changes after result is shown (rotation / resize)
    (function watchResize() {
      const canvas = document.getElementById('canvas');
      if (!canvas) return;
      // use ResizeObserver if available for precise tracking
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => {
          // only do when result visible
          if (document.getElementById('result').style.display === 'block') {
            // adjust internal size and redraw result (redraw with same percentage)
            const percentage = Math.round((score / questions.length) * 100);
            resizeCanvasToDisplaySize(canvas);
            // redrawing: use same logic as showResult but without reloading image
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = "zama-image.jpg";
            img.onload = function () {
              const rect = canvas.getBoundingClientRect();
              const cssW = rect.width;
              const cssH = rect.height || (cssW * (canvas.height / canvas.width));
              ctx.clearRect(0,0,canvas.width,canvas.height);
              ctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, cssW, cssH);
              ctx.font = "bold 60px Arial";
              ctx.fillStyle = "black";
              ctx.fillText(`${percentage}%`, 40, 100);
            };
            img.onerror = function () {
              const rect = canvas.getBoundingClientRect();
              const cssW = rect.width;
              const cssH = rect.height || (cssW * (canvas.height / canvas.width));
              ctx.clearRect(0,0,canvas.width,canvas.height);
              ctx.fillStyle = "#FFD700";
              ctx.fillRect(0,0,cssW,cssH);
              ctx.font = "bold 60px Arial";
              ctx.fillStyle = "black";
              ctx.fillText(`${percentage}%`, 40, 100);
            };
          }
        });
        ro.observe(canvas);
      } else {
        // fallback: on window resize redraw if result visible
        window.addEventListener('resize', () => {
          if (document.getElementById('result').style.display === 'block') {
            showResult(); // redraw fresh
          }
        });
      }
    })();

    function shareImage() {
      const canvas = document.getElementById("canvas");
      const percentage = Math.round((score / questions.length) * 100);
      const shareText = `I scored ${percentage}% on the Zama FHE Quiz! 🔐✨ #ZamaCreatorProgram`;

      canvas.toBlob(function (blob) {
        const file = new File([blob], "zama-quiz-result.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({
            title: "Zama Quiz Result",
            text: shareText,
            files: [file]
          }).catch(err => console.log("Share failed", err));
        } else {
          downloadImage();
          alert("Your browser does not support direct sharing. The image will be downloaded — upload it manually on X (Twitter).");
        }
      }, "image/png");
    }

    function downloadImage() {
      const canvas = document.getElementById("canvas");
      const link = document.createElement("a");
      link.download = "zama-quiz-result.png";
      // Ensure we use toDataURL after canvas internal resolution is set
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
