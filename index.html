<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zama Quiz — 10 Questions</title>
  <style>
    body {
      font-family: "Poppins", Arial, sans-serif;
      background-color: #ffcc00; /* Zama Yellow */
      color: #000000; /* Black text */
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      color: #000000;
      font-weight: 800;
      margin-top: 40px;
    }
    #intro, #quiz, #result {
      margin-top: 40px;
    }
    #quiz, #result {
      display: none;
    }
    p {
      font-size: 18px;
      font-weight: 500;
    }
    button {
      background-color: #000000;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    button:hover {
      background-color: #ffffff;
      color: #000000;
    }
    #timer {
      font-size: 20px;
      color: #000000;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .question {
      font-weight: bold;
      font-size: 20px;
      margin: 20px auto;
      max-width: 700px;
      line-height: 1.4;
    }
    .option-btn {
      display: block;
      background-color: #ffffff;
      color: #000000;
      border: 2px solid #000;
      border-radius: 10px;
      margin: 10px auto;
      padding: 12px;
      font-size: 18px;
      font-weight: 600;
      width: 60%;
      text-align: left;
      transition: all 0.25s ease;
    }
    .option-btn:hover {
      background-color: #000000;
      color: #ffffff;
    }
    canvas {
      margin-top: 30px;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <h1>Zama Quiz — 10 Questions</h1>

  <div id="intro">
    <p><b>Start the quiz and challenge yourself!</b><br>
    You have <b>15 seconds</b> for each question — you cannot go back.<br>
    Let’s see how much you know about <b>Zama & FHE</b>.</p>
    <button onclick="startQuiz()">Start Quiz</button>
  </div>

  <div id="quiz"></div>

  <div id="result">
    <canvas id="canvas" width="800" height="600"></canvas><br>
    <button onclick="shareImage()">Share on X</button>
    <button onclick="shareDiscord()">Share on Discord</button>
    <button onclick="downloadImage()">Download Result</button>
  </div>

  <script>
    const questions = [
      { q: "1. What does FHE stand for?",
        options: ["Fast Homomorphic Encryption", "Fully Homomorphic Encryption", "Federated Homomorphic Encoding", "Fault-tolerant Hash Encryption"],
        correct: "Fully Homomorphic Encryption" },
      { q: "2. Which company provides this protocol?",
        options: ["Zama", "ZeroCorp", "CryptoChain", "Homomorphic Labs"],
        correct: "Zama" },
      { q: "3. What is the main advantage of FHE for blockchain apps?",
        options: ["Lower gas fees", "End-to-end encrypted computation on encrypted data", "Faster transaction finality", "Easier wallet integration"],
        correct: "End-to-end encrypted computation on encrypted data" },
      { q: "4. The Zama Protocol is described as:",
        options: ["A new L1 blockchain", "A cross-chain confidentiality layer", "A centralized cloud service", "A browser extension"],
        correct: "A cross-chain confidentiality layer" },
      { q: "5. Which of the following is an open-source Zama project?",
        options: ["tfhe-rs", "homomorph-py", "secret-chain", "zchain-sdk"],
        correct: "tfhe-rs" },
      { q: "6. What does composability mean in smart contracts?",
        options: ["Contracts can be combined to build new apps", "Contracts can only be read by nodes", "Contracts are automatically encrypted", "Contracts have fixed gas rates"],
        correct: "Contracts can be combined to build new apps" },
      { q: "7. Zama’s FHE is post-quantum, meaning:",
        options: ["It uses quantum computers", "No known quantum algorithm breaks it", "It is slower after quantum improvements", "It requires a quantum internet"],
        correct: "No known quantum algorithm breaks it" },
      { q: "8. Which component decentralizes Zama’s network key?",
        options: ["HPU", "MPC (Multi-Party Computation)", "Relayer", "Browser wallet"],
        correct: "MPC (Multi-Party Computation)" },
      { q: "9. Main use case for confidential smart contracts?",
        options: ["Public mempool monitoring", "Confidential payments and tokenization", "Reducing block size", "Faster mining"],
        correct: "Confidential payments and tokenization" },
      { q: "10. Where can developers find Zama’s code?",
        options: ["On GitHub (zama-ai)", "On a private repo", "Only a PDF", "Closed app store"],
        correct: "On GitHub (zama-ai)" }
    ];

    let current = 0, score = 0, timer, timeLeft = 15;
    const LETTERS = ["A","B","C","D"];

    function startQuiz() {
      document.getElementById("intro").style.display = "none";
      document.getElementById("quiz").style.display = "block";
      showQuestion();
    }

    function showQuestion() {
      const quizDiv = document.getElementById("quiz");
      quizDiv.innerHTML = "";

      if (current < questions.length) {
        const q = questions[current];
        const timerDiv = document.createElement("div");
        timerDiv.id = "timer";
        timerDiv.textContent = `Time left: ${timeLeft}s`;

        const qDiv = document.createElement("div");
        qDiv.classList.add("question");
        qDiv.textContent = q.q;

        quizDiv.appendChild(timerDiv);
        quizDiv.appendChild(qDiv);

        q.options.forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerHTML = `<b>${LETTERS[i]}.</b> ${opt}`;
          btn.onclick = () => answer(opt);
          quizDiv.appendChild(btn);
        });

        startTimer();
      } else {
        showResult();
      }
    }

    function startTimer() {
      timeLeft = 15;
      clearInterval(timer);
      timer = setInterval(() => {
        document.getElementById("timer").textContent = `Time left: ${timeLeft}s`;
        timeLeft--;
        if (timeLeft < 0) {
          clearInterval(timer);
          nextQuestion();
        }
      }, 1000);
    }

    function answer(selected) {
      clearInterval(timer);
      if (selected === questions[current].correct) score++;
      nextQuestion();
    }

    function nextQuestion() {
      current++;
      showQuestion();
    }

    function showResult() {
      document.getElementById("quiz").style.display = "none";
      document.getElementById("result").style.display = "block";

      const percentage = Math.round((score / questions.length) * 100);
      drawResultImage(percentage);
    }

    function drawResultImage(percentage){
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0,0,w,h);

      const img = new Image();
      img.src = "zama-image.jpg";
      img.onload = function(){
        ctx.drawImage(img, 0, 0, w, h);
        drawTopLeftScore(ctx, percentage);
      };
      img.onerror = function(){
        const g = ctx.createLinearGradient(0,0,w,h);
        g.addColorStop(0,"#ffffff");
        g.addColorStop(1,"#fff8cc");
        ctx.fillStyle = g;
        ctx.fillRect(0,0,w,h);
        drawTopLeftScore(ctx, percentage);
      };
    }

    function drawTopLeftScore(ctx, percentage){
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.fillRect(20, 20, 240, 120);
      ctx.fillStyle = "#000000";
      ctx.font = "700 20px Arial";
      ctx.fillText("QUIZ SCORE", 40, 55);
      ctx.font = "900 60px Arial";
      ctx.fillText(`${percentage}%`, 40, 110);
    }

    function shareImage(){
      const canvas = document.getElementById("canvas");
      const percentage = Math.round((score / questions.length) * 100);
      const text = `I scored ${percentage}% on the Zama FHE Quiz! 🔐✨ #ZamaCreatorProgram`;

      canvas.toBlob(blob => {
        const file = new File([blob], "zama-quiz.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({
            title: "Zama Quiz Result",
            text: text,
            files: [file]
          }).catch(() => downloadImage());
        } else {
          downloadImage();
          alert("Your browser doesn't support direct sharing. Image downloaded — you can share it manually on X or Discord.");
        }
      });
    }

    function shareDiscord(){
      const percentage = Math.round((score / questions.length) * 100);
      const text = `I scored ${percentage}% on the Zama FHE Quiz! 🔐✨ #ZamaCreatorProgram`;
      navigator.clipboard.writeText(text).then(() => {
        alert("✅ Text copied! Now open Discord and press Ctrl+V to share.");
      });
    }

    function downloadImage(){
      const canvas = document.getElementById("canvas");
      const link = document.createElement("a");
      link.download = "zama-quiz-result.png";
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
