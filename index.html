<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zama Quiz — 10 Questions</title>
  <style>
    :root{
      --accent-yellow: #ffd700; /* main yellow */
      --black: #000000;
      --white: #ffffff;
      --card-radius: 14px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; padding:36px 18px;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--accent-yellow); /* page background requested to be yellow */
      color: var(--black); /* primary text black */
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      text-align:center;
    }

    h1{margin:6px 0 12px;font-size:28px;color:var(--black);font-weight:800}

    /* Intro */
    #intro{max-width:880px;margin:0 auto;background:rgba(255,255,255,0.95);padding:20px;border-radius:var(--card-radius);box-shadow:0 10px 30px rgba(0,0,0,0.12)}
    #intro p{margin:6px 0;color:var(--black);font-size:16px;font-weight:700}
    .start-btn{background:var(--black);color:var(--accent-yellow);border:none;padding:12px 20px;border-radius:10px;font-weight:800;cursor:pointer;font-size:15px}
    .start-btn:hover{opacity:0.95}

    /* Quiz area sits on a white card for readability */
    #quiz{display:none;max-width:920px;margin:26px auto;padding:18px;border-radius:var(--card-radius);background:var(--white);color:var(--black);box-shadow:0 12px 36px rgba(0,0,0,0.12);text-align:left}

    .meta-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

    /* timer: use black, yellow and white */
    .timer-badge{display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;background:var(--black);color:var(--accent-yellow);font-weight:900;font-size:16px}
    .timer-bar-outer{width:280px;background:rgba(0,0,0,0.06);height:12px;border-radius:999px;overflow:hidden;border:1px solid rgba(0,0,0,0.04)}
    .timer-bar-inner{height:100%;width:100%;background:linear-gradient(90deg,var(--accent-yellow), #ffd84a);transition:width 0.2s linear}

    .question-box{padding:6px}
    .qnum{color:rgba(0,0,0,0.65);font-weight:800;margin-bottom:6px}
    .qtext{font-size:20px;margin:0 0 18px;color:var(--black);font-weight:800} /* bold questions */

    .options{display:flex;flex-direction:column;gap:12px}
    .option-btn{display:flex;align-items:center;gap:14px;background:transparent;color:var(--black);border:2px solid rgba(0,0,0,0.08);padding:12px;border-radius:12px;text-align:left;font-weight:800;cursor:pointer;font-size:15px}
    .option-btn .letter{min-width:44px;height:44px;border-radius:50%;background:var(--black);color:var(--white);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}
    .option-btn .label{font-weight:800}
    .option-btn:hover{background:rgba(0,0,0,0.04)}
    .option-btn[disabled]{opacity:0.6;cursor:not-allowed}

    /* Result area - minimal: show canvas centered (canvas will draw top-left score card) */
    #result{display:none;margin-top:20px;text-align:center}
    canvas{border-radius:12px;display:block;margin:12px auto;border:0}
    .actions{display:flex;gap:12px;justify-content:center;margin-top:10px}
    .action-btn{background:var(--black);color:var(--accent-yellow);border:none;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}

    @media (max-width:640px){
      .timer-bar-outer{width:140px}
      .qtext{font-size:18px}
      .option-btn{font-size:15px}
      .option-btn .letter{min-width:38px;height:38px}
    }
  </style>
</head>
<body>
  <h1>Zama Quiz — 10 Questions</h1>

  <div id="intro">
    <!-- Requested short intro in English, black text on white card -->
    <p>Start by tapping "Start" — you have <strong>15 seconds</strong> for each question.</p>
    <div style="margin-top:12px"><button id="startBtn" class="start-btn">Start</button></div>
  </div>

  <div id="quiz" aria-live="polite">
    <div class="meta-row">
      <div id="progressText" style="font-weight:900;color:rgba(0,0,0,0.9)">Question 1 / 10</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="timer-badge" id="timerBadge"><span id="timerText">15s</span></div>
        <div class="timer-bar-outer" aria-hidden="true"><div class="timer-bar-inner" id="timerBar" style="width:100%"></div></div>
      </div>
    </div>

    <div class="question-box">
      <div class="qnum" id="qNum">Question 1</div>
      <p class="qtext" id="qText">Loading question…</p>
      <div class="options" id="options"></div>
    </div>
  </div>

  <div id="result">
    <canvas id="resultCanvas" width="820" height="460" aria-label="Quiz result image"></canvas>
    <div class="actions">
      <button class="action-btn" id="shareBtn">Share on X</button>
      <button class="action-btn" id="downloadBtn">Download</button>
    </div>
  </div>

  <script>
    // Questions (unchanged content)
    const questions = [
      { q: "What does FHE stand for?", options: ["Fast Homomorphic Encryption","Fully Homomorphic Encryption","Federated Homomorphic Encoding","Fault-tolerant Hash Encryption"], correct: "Fully Homomorphic Encryption"},
      { q: "Which company/project provides the protocol you studied here?", options: ["Zama","ZeroCorp","CryptoChain","Homomorphic Labs"], correct: "Zama"},
      { q: "What is the main advantage of FHE for blockchain apps?", options: ["Lower gas fees","End-to-end encrypted computation on encrypted data","Faster transaction finality","Easier wallet integration"], correct: "End-to-end encrypted computation on encrypted data"},
      { q: "The Zama Protocol is mainly described as:", options: ["A new L1 blockchain","A cross-chain confidentiality layer","A centralized cloud service","A browser extension"], correct: "A cross-chain confidentiality layer"},
      { q: "Which of the following is an open-source Zama project?", options: ["tfhe-rs","homomorph-py","secret-chain","zchain-sdk"], correct: "tfhe-rs"},
      { q: "What does composability mean in the context of smart contracts?", options: ["Contracts can be combined to build new apps","Contracts can only be read by nodes","Contracts are automatically encrypted","Contracts have fixed gas rates"], correct: "Contracts can be combined to build new apps"},
      { q: "Zama’s FHE approach claims to be post-quantum. This means:", options: ["It uses quantum computers to encrypt data","No known quantum algorithm currently breaks it","It is slower after quantum improvements","It requires a quantum internet"], correct: "No known quantum algorithm currently breaks it"},
      { q: "Which component helps decentralize the global network key in Zama?", options: ["HPU","MPC (Multi-Party Computation)","Relayer","Browser wallet"], correct: "MPC (Multi-Party Computation)"},
      { q: "What is a primary use case for confidential smart contracts?", options: ["Public mempool monitoring","Confidential payments and tokenization","Reducing block size","Faster mining"], correct: "Confidential payments and tokenization"},
      { q: "Where can developers find Zama’s source code?", options: ["On GitHub (zama-ai)","On a private repo only","On a whitepaper PDF only","On a closed app store"], correct: "On GitHub (zama-ai)"}
    ];

    const LETTERS = ['A','B','C','D'];
    const QUESTION_TIME = 15;
    let current = 0; let score = 0; let timer = null; let timeLeft = QUESTION_TIME;

    // DOM
    const startBtn = document.getElementById('startBtn');
    const quizDiv = document.getElementById('quiz');
    const resultDiv = document.getElementById('result');
    const qNumEl = document.getElementById('qNum');
    const qTextEl = document.getElementById('qText');
    const optionsEl = document.getElementById('options');
    const timerText = document.getElementById('timerText');
    const timerBar = document.getElementById('timerBar');
    const progressText = document.getElementById('progressText');
    const scoreText = document.getElementById('scoreText');
    const shareBtn = document.getElementById('shareBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    startBtn.addEventListener('click', startQuiz);
    shareBtn.addEventListener('click', shareImage);
    downloadBtn.addEventListener('click', downloadImage);

    function startQuiz(){
      current = 0; score = 0;
      document.getElementById('intro').style.display = 'none';
      resultDiv.style.display = 'none';
      quizDiv.style.display = 'block';
      showQuestion();
    }

    function showQuestion(){
      const q = questions[current];
      progressText.textContent = `Question ${current+1} / ${questions.length}`;
      qNumEl.textContent = `Question ${current+1}`;
      qTextEl.textContent = q.q;

      optionsEl.innerHTML = '';
      q.options.forEach((opt,i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.type = 'button';
        btn.dataset.index = i;
        btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span class="label"> ${LETTERS[i]} - ${opt}</span>`;
        btn.addEventListener('click', () => answer(i));
        optionsEl.appendChild(btn);
      });

      startTimer();
    }

    function startTimer(){
      clearInterval(timer);
      timeLeft = QUESTION_TIME;
      updateTimerUI();
      timer = setInterval(() => {
        timeLeft -= 1;
        if (timeLeft <= 0){
          clearInterval(timer);
          disableOptions();
          setTimeout(() => nextQuestion(), 180);
        } else {
          updateTimerUI();
        }
      }, 1000);
    }

    function updateTimerUI(){
      timerText.textContent = `${timeLeft}s`;
      const pct = Math.max(0,(timeLeft/QUESTION_TIME)*100);
      timerBar.style.width = `${pct}%`;
    }

    function disableOptions(){
      const buttons = optionsEl.querySelectorAll('button');
      buttons.forEach(b => b.disabled = true);
    }

    function answer(index){
      disableOptions(); clearInterval(timer);
      const selected = questions[current].options[index];
      const correct = questions[current].correct;

      // highlight correct option subtly
      const buttons = optionsEl.querySelectorAll('button');
      buttons.forEach(btn => {
        const i = Number(btn.dataset.index);
        if (questions[current].options[i] === correct){
          btn.style.border = '2px solid rgba(0,0,0,0.16)';
          btn.style.boxShadow = '0 8px 20px rgba(0,0,0,0.06)';
        } else if (i === index && questions[current].options[i] !== correct){
          btn.style.opacity = '0.6';
        }
      });

      if (selected === correct) score++;
      setTimeout(() => nextQuestion(), 300);
    }

    function nextQuestion(){
      current++;
      if (current >= questions.length) showResult();
      else showQuestion();
    }

    /* Result drawing: top-left card only with 'QUIZ SCORE' and percentage below */
    function showResult(){
      quizDiv.style.display = 'none';
      resultDiv.style.display = 'block';
      const percentage = Math.round((score/questions.length)*100);
      drawResultImage(percentage);
    }

    function drawResultImage(percentage){
      const canvas = document.getElementById('resultCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width; const h = canvas.height;
      ctx.clearRect(0,0,w,h);

      // background: subtle diagonal gradient using white and a light yellow so card stands out
      const g = ctx.createLinearGradient(0,0,w,h);
      g.addColorStop(0,'#ffffff');
      g.addColorStop(1,'#fff9e6');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);

      // top-left card
      const pad = 20; const cardW = 260; const cardH = 140; const r = 12;
      // rounded rect
      ctx.beginPath();
      ctx.moveTo(pad+r,pad);
      ctx.lineTo(pad+cardW-r,pad);
      ctx.quadraticCurveTo(pad+cardW,pad+0,pad+cardW,pad+r);
      ctx.lineTo(pad+cardW,pad+cardH-r);
      ctx.quadraticCurveTo(pad+cardW,pad+cardH,pad+cardW-r,pad+cardH);
      ctx.lineTo(pad+r,pad+cardH);
      ctx.quadraticCurveTo(pad,pad+cardH,pad,pad+cardH-r);
      ctx.lineTo(pad,pad+r);
      ctx.quadraticCurveTo(pad,pad,pad+r,pad);
      ctx.closePath();

      // fill with white and subtle shadow
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0,0,0,0.12)';
      ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
      ctx.fill();
      ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

      // Label: QUIZ SCORE
      ctx.fillStyle = '#000000';
      ctx.font = '700 18px Inter, Arial';
      ctx.textBaseline = 'top';
      ctx.fillText('QUIZ SCORE', pad + 18, pad + 18);

      // Big percentage centered under label
      ctx.font = '800 64px Inter, Arial';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${percentage}%`, pad + 18, pad + cardH/2 + 8);

      // nothing else at bottom (user requested no bottom band)
    }

    // share / download
    function shareImage(){
      const canvas = document.getElementById('resultCanvas');
      canvas.toBlob(function(blob){
        const file = new File([blob],'zama-quiz-result.png',{type:'image/png'});
        const shareText = `I scored ${Math.round((score/questions.length)*100)}% on the Zama FHE Quiz! #ZamaOGNFT`;
        if (navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({title:'Zama Quiz Result',text:shareText,files:[file]}).catch(err=>console.log('Share failed',err));
        } else {
          downloadImage();
          alert('Direct sharing is not supported by this browser. The image was downloaded — upload it to X manually.');
        }
      }, 'image/png');
    }

    function downloadImage(){
      const canvas = document.getElementById('resultCanvas');
      const link = document.createElement('a');
      link.download = 'zama-quiz-result.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // accessibility
    startBtn.addEventListener('keyup',(e)=>{ if (e.key === 'Enter') startBtn.click(); });
  </script>
</body>
</html>
