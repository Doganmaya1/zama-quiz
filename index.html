<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zama Quiz — 10 Questions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0b1622;
      color: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      color: #00ffcc;
      margin-top: 40px;
    }
    #quiz, #result {
      display: none;
      margin-top: 40px;
    }
    .question {
      display: none;
      font-size: 18px;
      margin: 20px;
    }
    button {
      background-color: #00ffcc;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
      color: #000;
      font-weight: bold;
    }
    button:hover {
      background-color: #00ddb3;
    }
    #timer {
      font-size: 20px;
      color: #ff6666;
      margin-bottom: 15px;
    }
    canvas {
      border-radius: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Zama Quiz — 10 Questions</h1>
  <div id="intro">
    <p>No login, no email — just click and play. You have <b>15 seconds</b> for each question. You cannot go back!</p>
    <button onclick="startQuiz()">Start Quiz</button>
    <p style="font-size: 13px; color: #999;">Note: At the end, your score will be shown on a Zama image. You can share it directly on X (Twitter) or download it.</p>
  </div>

  <div id="quiz"></div>

  <div id="result">
    <h2>Your Result: <span id="score"></span></h2>
    <canvas id="canvas" width="800" height="600"></canvas><br>
    <button onclick="shareImage()">Share on X</button>
    <button onclick="downloadImage()">Download Result</button>
  </div>

  <script>
    const questions = [
      {
        q: "1. What does FHE stand for?",
        options: [
          "Fast Homomorphic Encryption",
          "Fully Homomorphic Encryption",
          "Federated Homomorphic Encoding",
          "Fault-tolerant Hash Encryption"
        ],
        correct: "Fully Homomorphic Encryption"
      },
      {
        q: "2. Which company/project provides the protocol you studied here?",
        options: ["Zama", "ZeroCorp", "CryptoChain", "Homomorphic Labs"],
        correct: "Zama"
      },
      {
        q: "3. What is the main advantage of FHE for blockchain apps?",
        options: [
          "Lower gas fees",
          "End-to-end encrypted computation on encrypted data",
          "Faster transaction finality",
          "Easier wallet integration"
        ],
        correct: "End-to-end encrypted computation on encrypted data"
      },
      {
        q: "4. The Zama Protocol is mainly described as:",
        options: [
          "A new L1 blockchain",
          "A cross-chain confidentiality layer",
          "A centralized cloud service",
          "A browser extension"
        ],
        correct: "A cross-chain confidentiality layer"
      },
      {
        q: "5. Which of the following is an open-source Zama project?",
        options: ["tfhe-rs", "homomorph-py", "secret-chain", "zchain-sdk"],
        correct: "tfhe-rs"
      },
      {
        q: "6. What does composability mean in the context of smart contracts?",
        options: [
          "Contracts can be combined to build new apps",
          "Contracts can only be read by nodes",
          "Contracts are automatically encrypted",
          "Contracts have fixed gas rates"
        ],
        correct: "Contracts can be combined to build new apps"
      },
      {
        q: "7. Zama’s FHE approach claims to be post-quantum. This means:",
        options: [
          "It uses quantum computers to encrypt data",
          "No known quantum algorithm currently breaks it",
          "It is slower after quantum improvements",
          "It requires a quantum internet"
        ],
        correct: "No known quantum algorithm currently breaks it"
      },
      {
        q: "8. Which component helps decentralize the global network key in Zama?",
        options: ["HPU", "MPC (Multi-Party Computation)", "Relayer", "Browser wallet"],
        correct: "MPC (Multi-Party Computation)"
      },
      {
        q: "9. What is a primary use case for confidential smart contracts?",
        options: [
          "Public mempool monitoring",
          "Confidential payments and tokenization",
          "Reducing block size",
          "Faster mining"
        ],
        correct: "Confidential payments and tokenization"
      },
      {
        q: "10. Where can developers find Zama’s source code?",
        options: [
          "On GitHub (zama-ai)",
          "On a private repo only",
          "On a whitepaper PDF only",
          "On a closed app store"
        ],
        correct: "On GitHub (zama-ai)"
      }
    ];

    let current = 0;
    let score = 0;
    let timer;
    let timeLeft = 15;

    function startQuiz() {
      document.getElementById("intro").style.display = "none";
      document.getElementById("quiz").style.display = "block";
      showQuestion();
    }

    function showQuestion() {
      const quizDiv = document.getElementById("quiz");
      quizDiv.innerHTML = "";

      if (current < questions.length) {
        const q = questions[current];
        const qDiv = document.createElement("div");
        qDiv.classList.add("question");

        const timerDiv = document.createElement("div");
        timerDiv.id = "timer";
        timerDiv.textContent = `Time left: ${timeLeft}s`;
        qDiv.appendChild(timerDiv);

        const qText = document.createElement("p");
        qText.textContent = q.q;
        qDiv.appendChild(qText);

        q.options.forEach(opt => {
          const btn = document.createElement("button");
          btn.textContent = opt;
          btn.onclick = () => answer(opt);
          qDiv.appendChild(btn);
        });

        quizDiv.appendChild(qDiv);
        qDiv.style.display = "block";
        startTimer();
      } else {
        showResult();
      }
    }

    function startTimer() {
      timeLeft = 15;
      document.getElementById("timer").textContent = `Time left: ${timeLeft}s`;
      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").textContent = `Time left: ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          nextQuestion();
        }
      }, 1000);
    }

    function answer(selected) {
      clearInterval(timer);
      if (selected === questions[current].correct) score++;
      nextQuestion();
    }

    function nextQuestion() {
      current++;
      showQuestion();
    }

    function showResult() {
      document.getElementById("quiz").style.display = "none";
      document.getElementById("result").style.display = "block";
      const percentage = Math.round((score / questions.length) * 100);
      document.getElementById("score").innerText = `${percentage}% correct answers`;

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const img = new Image();
      img.src = "zama-image.jpg";
      img.onload = function () {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.font = "bold 50px Arial";
        ctx.fillStyle = "white";
        ctx.fillText(`${percentage}%`, 350, 300);
      };
    }

    function shareImage() {
      const canvas = document.getElementById("canvas");
      const percentage = Math.round((score / questions.length) * 100);
      const shareText = `I scored ${percentage}% on the Zama FHE Quiz! #ZamaOGNFT`;

      canvas.toBlob(function (blob) {
        const file = new File([blob], "zama-quiz-result.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({
            title: "Zama Quiz Result",
            text: shareText,
            files: [file]
          }).catch(err => console.log("Share failed", err));
        } else {
          downloadImage();
          alert("Your browser does not support direct sharing. The image will be downloaded — upload it manually on X (Twitter).");
        }
      }, "image/png");
    }

    function downloadImage() {
      const canvas = document.getElementById("canvas");
      const link = document.createElement("a");
      link.download = "zama-quiz-result.png";
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
